name: Linux AppImage Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the successful AppImage build as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: shandalar AppImage
    # Pinned to 22.04 (glibc 2.35) so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - name: Check required source credential
        env:
          SHANDALAR_SOURCE_PAT: ${{ secrets.SHANDALAR_SOURCE_PAT }}
        run: |
          if [[ -z "$SHANDALAR_SOURCE_PAT" ]]; then
            echo "Set the SHANDALAR_SOURCE_PAT repository secret to a read-only fine-grained PAT for rlerrr/shandalar-sdl3." >&2
            exit 1
          fi

      - name: Check out private Shandalar source
        uses: actions/checkout@v7
        with:
          repository: rlerrr/shandalar-sdl3
          token: ${{ secrets.SHANDALAR_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
          ref: x64-port

      - name: Install build dependencies
        # Full SDL3 Linux dep set per https://wiki.libsdl.org/SDL3/README-linux
        # (X11 sub-deps are mandatory once X11 is found, so install them all
        # up front rather than one fatal error at a time).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang python3-pip \
            build-essential git \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxrender-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev
          pip3 install --quiet pillow

      - name: Install packaging tools (linuxdeploy, rclone)
        run: |
          mkdir -p "${{ github.workspace }}/tools-appimage"
          cd "${{ github.workspace }}/tools-appimage"
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure CMake (shandalar)
        run: |
          cmake -S "${{ github.workspace }}" \
                -B "${{ github.workspace }}/build-appimage" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/AppDir/usr" \
                -DSHANDALAR_BUILD_FACEMAKER=OFF \
                -DSHANDALAR_BUILD_SHANDALAR=ON \
                -DSHANDALAR_BUILD_DECK=OFF \
                -DSHANDALAR_BUILD_TESTS=OFF

      - name: Build (shandalar)
        run: cmake --build "${{ github.workspace }}/build-appimage"

      - name: Stage AppDir (binary, icon, desktop entry, AppRun)
        run: |
          cmake --install "${{ github.workspace }}/build-appimage"
          # RUNTIME DESTINATION is '.' so the binary lands in AppDir/usr;
          # move it to the usr/bin linuxdeploy expects and fail fast if absent.
          mkdir -p "${{ github.workspace }}/AppDir/usr/bin"
          mv "${{ github.workspace }}/AppDir/usr/shandalar" "${{ github.workspace }}/AppDir/usr/bin/shandalar"
          test -x "${{ github.workspace }}/AppDir/usr/bin/shandalar"
          python3 -c "from PIL import Image; Image.open('${{ github.workspace }}/src/shandalar/shandalar.ico').save('${{ github.workspace }}/AppDir/shandalar.png')"
          cat > "${{ github.workspace }}/AppDir/shandalar.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Shandalar
          Comment=Magic: The Gathering (1997) SDL3 port
          Exec=shandalar
          Icon=shandalar
          Categories=Game;CardGame;
          Terminal=false
          EOF
          cat > "${{ github.workspace }}/AppDir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          SHANDALAR_WINDOW_ICON="$HERE/shandalar.png"
          export SHANDALAR_WINDOW_ICON
          SHANDALAR_USER_DATA_DIR="${SHANDALAR_USER_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/shandalar/userdata}"
          mkdir -p -- "$SHANDALAR_USER_DATA_DIR" || exit 1
          export SHANDALAR_USER_DATA_DIR
          exec "$HERE/usr/bin/shandalar" "$HERE/usr/share/shandalar/assets" "$@"
          EOF
          chmod +x "${{ github.workspace }}/AppDir/AppRun"

      - name: Download game assets from R2 (bucket shandalar-dotp, no prefix)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [[ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" || -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" || "$RCLONE_CONFIG_R2_ENDPOINT" == "https://.r2.cloudflarestorage.com" ]]; then
            echo "Set R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY repository secrets." >&2
            exit 1
          fi
          rclone sync R2:shandalar-dotp "${{ github.workspace }}/AppDir/usr/share/shandalar/assets" --progress=false --checkers=8 --transfers=8

      - name: Build AppImage
        run: |
          cd "${{ github.workspace }}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./tools-appimage/linuxdeploy --appdir AppDir \
            -d AppDir/shandalar.desktop -i AppDir/shandalar.png \
            --output appimage
          ls -la ./*.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/Shandalar-x86_64.AppImage
          archive: false
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha=$(git rev-parse HEAD)
          tag="appimage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$GITHUB_WORKSPACE/Shandalar-x86_64.AppImage" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Shandalar AppImage build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from rlerrr/shandalar-sdl3 x64-port commit ${source_sha}." \
            --latest

